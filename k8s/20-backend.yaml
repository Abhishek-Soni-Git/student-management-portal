apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ${ACR_LOGIN_SERVER}/sms-backend:${IMAGE_TAG}
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sms
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
