apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${ACR_LOGIN_SERVER}/sms-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 5173
          env:
            # Vite dev server runtime par ye env padhta hai; same-origin /api ingress se backend ko jayega
            - name: VITE_API_URL
              value: /api
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sms
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
