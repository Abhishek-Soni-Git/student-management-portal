# Applied by the infra workflow (needs cluster-level rights). App workflow only has rights INSIDE this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: sms
  labels:
    # Pod Security Admission: pods that are not "restricted" are rejected
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
