# HTTP only for now (no domain yet). Add a host + TLS secret/cert-manager or Key Vault cert before real users.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sms
  namespace: sms
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
