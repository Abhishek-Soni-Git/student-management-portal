name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "k8s/base/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC to Azure
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_deploy_principal_object_id: ${{ vars.DEPLOY_SP_OBJECT_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  # Pull requests: READ-ONLY identity. A PR can never change Azure.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
      - name: Plan (read-only, no state lock)
        run: terraform plan -input=false -lock=false

  # main / manual: write identity, behind the infra-apply environment (approval + main only).
  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: infra-apply
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.INFRA_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (exactly the plan above)
        working-directory: infra
        run: terraform apply -input=false tfplan

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply cluster baseline (namespace, pod security, network policies)
        run: |
          sudo az aks install-cli
          az aks get-credentials -g "${{ vars.APP_RG }}" -n "${{ vars.AKS_NAME }}" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          # Azure RBAC role assignments can take a few minutes to propagate
          ok=0
          for i in $(seq 1 10); do
            if kubectl apply -f k8s/base; then ok=1; break; fi
            echo "retry $i/10 in 30s (waiting for RBAC propagation)"; sleep 30
          done
          [ "$ok" = 1 ]
