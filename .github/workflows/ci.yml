name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-checks:
    name: terraform-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=infra fmt -check -recursive
      - name: validate (no backend, no credentials)
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: IaC misconfiguration scan (Terraform)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Kubernetes manifest scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"

  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (not pushed)
        run: |
          docker build -t sms-backend:ci  ./backend
          docker build -t sms-frontend:ci -f frontend/Dockerfile.prod ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: sms-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: sms-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
